name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: docker images (api + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target api -t genui-api:ci .
      - run: docker build --target web -t genui-web:ci .
      - name: web config renders and nginx accepts it
        run: docker run --rm -e API_UPSTREAM=127.0.0.1:9 genui-web:ci sh -c '/docker-entrypoint.sh nginx -t'
