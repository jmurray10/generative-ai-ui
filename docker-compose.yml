# Two services: `web` serves the client and proxies the API on one origin;
# `api` runs Express (generation, chat, Jev routing, /voice). Only web is published.
#
#   docker compose up --build            http://localhost:8080
#   docker compose logs -f api           structured API logs (LOG_LEVEL=debug for more)
#   docker compose logs -f web           request log from nginx

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    build:
      context: .
      target: api
    image: genui-playground-api:dev
    container_name: genui-api
    expose:
      - "8080"
    environment:
      - PORT=8080
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-pretty}
      - GENERATOR=${GENERATOR:-grok}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - XAI_BASE_URL=${XAI_BASE_URL:-}
      - GROK_MODEL=${GROK_MODEL:-grok-4.7}
      - GROK_REASONING_EFFORT=${GROK_REASONING_EFFORT:-low}
      - VOICE_PROVIDER=${VOICE_PROVIDER:-}
      - GROK_VOICE_MODEL=${GROK_VOICE_MODEL:-grok-voice-latest}
      - GROK_VOICE=${GROK_VOICE:-eve}
      - GROK_VOICE_REASONING=${GROK_VOICE_REASONING:-none}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}
      # Jev toolbox router: TypeSafe Jev when TYPESAFE_API_KEY is set, else a Grok judge.
      - TOOLBOX_DECIDER=${TOOLBOX_DECIDER:-auto}
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY:-}
      - TYPESAFE_DEFAULT_MODEL=${TYPESAFE_DEFAULT_MODEL:-}
      - JEV_JUDGE_MODEL=${JEV_JUDGE_MODEL:-grok-4.20-0309-non-reasoning}
      - CHAT_CONFIRM_MODEL=${CHAT_CONFIRM_MODEL:-}
      - RATE_LIMIT_PER_MIN=${RATE_LIMIT_PER_MIN:-30}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - MAX_SPEC_CHARS=${MAX_SPEC_CHARS:-200000}
      - VOICE_MAX_SESSIONS=${VOICE_MAX_SESSIONS:-2}
      - VOICE_OPENS_PER_MIN=${VOICE_OPENS_PER_MIN:-10}
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      target: web
    image: genui-playground-web:dev
    container_name: genui-web
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      - API_UPSTREAM=api:8080
      - PORT=8080
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
